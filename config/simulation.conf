# Configuration of run_simulation.sh: toy MC simulation + digitization.
# One "key = value" per line, "#" for comments. Keys are grouped in sections:
#   [common]        used by both steps
#   [toy_mc]        passed to traccc_toy_mc 
#   [digitization]  passed to toy_digitize.py 
# Any key can be changed from the command line, e.g.
#   ./run_simulation.sh config/simulation.conf gen-nparticles=500 output-directory=data/run_500

[common]
# Statistical seed of both the simulation and the digitization.
seed = 0
# Output folder, inside data/ (events, detector files, cells).
output-directory = run_100ev/run_50

[toy_mc]
# Detector
barrel = 4
endcap = 7
bfield-tesla = 2.0
smearing-um = 0

# Particles
gen-events = 10
gen-nparticles = 50
gen-mom-gev = 1:10
gen-phi-degree = 0:360
gen-eta = -1:1

# Propagation
constraint-step-size-mm = 1
search-window = 3:3

[digitization]
# Pixel matrix, the same for all modules.
# It must cover the largest module of the toy detector (about 10 x 39 mm half-size).
pitch-um = 50
half-size0-mm = 12
half-size1-mm = 40

# Charge deposit (Landau, approximated with a Moyal distribution).
# The thickness is the module material thickness in ToyMC.cpp (0.11 mm).
landau-mpv-e-per-um = 76
landau-width-e-per-um = 5
thickness-um = 110

# Gaussian charge cloud spreading over nearby pixels.
diffusion-sigma-um = 10
diffusion-n-sigma = 4

# Electronics.
noise-mean-e = 0
noise-sigma-e = 100
threshold-e = 1000
noisy-pixel-fraction = 1e-6
