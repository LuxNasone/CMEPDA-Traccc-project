# Configuration of the Hough transform track finder (src/reconstruction/hough.hpp).
# One "key = value" per line, "#" for comments. Missing keys keep their default.
#
# In the transverse plane a track from the origin is a circle; a hit at
# radius r and angle phi lies on the track with initial angle phi0 and
# curvature kappa = 1/R (signed by the charge) if
#     phi0 = phi - asin(r * kappa / 2)
# Every hit votes for the (phi0, kappa) cells it is compatible with; the cells
# with the votes of enough different modules are the track candidates.

# --- Slices in the polar angle ----------------------------------------------------
# The hits are split into overlapping slices of z/r, which is cot(theta) for a
# track from the origin; the Hough transform runs in every slice, so tracks
# with similar transverse parameters but different polar angles do not mix.
# For a track starting at z0 instead of 0, z/r changes along the track by
# about z0 * (1/r_in - 1/r_out) ~ 0.024 * z0 [mm]: the slice must be wider.
cot-theta-bin = 0.1

# --- Accumulator ---------------------------------------------------------------
# Width of a cell in phi0, in degrees.
phi-bin-deg = 0.5
# Width of a cell in kappa, in 1/mm. The hits of one track must fall in the
# same cell: a kappa error d shifts phi0 by (r_out - r_in) * d / 2 between the
# innermost and the outermost layer, which must stay within one phi0 cell.
# With r_in ~ 34 mm, r_out ~ 173 mm and 0.5 deg cells: d <= 1.2e-4 / mm.
kappa-bin-per-mm = 1.2e-4

# --- Track selection -----------------------------------------------------------
# Minimum transverse momentum, in GeV: sets the largest curvature searched,
# kappa_max = 0.3 * B / pT (in 1/m).
min-pt-gev = 0.6
# Magnetic field along z, in tesla (as in the simulation).
bfield-tesla = 2.0
# Minimum number of different modules (one per layer for a barrel track)
# voting for a cell and left on a track after the fit.
min-modules = 4

# --- Fit -----------------------------------------------------------------------
# Hits farther than this from the fitted circle (transverse) or from the
# fitted line (longitudinal) are removed and the fit is repeated, in mm.
max-residual-xy-mm = 1
max-residual-z-mm = 2.0
# Largest |z| of the track at the beam line, in mm (vertex region).
max-z0-mm = 250.0

# --- Duplicates ----------------------------------------------------------------
# A candidate sharing more than this fraction of its hits with a better track
# (more hits, then smaller residuals) is dropped.
max-shared-fraction = 0.3
