# Options passed to traccc_reco_cpu / traccc_reco_gpu by run_reco.sh.
# One option per line, written as --name=value. Lines starting with # are ignored.
# The detector and input files are added by run_reco.sh from the data folder.
# An option given on the run_reco.sh command line replaces the one written here.
--use-acts-geom-source=false
--seedfinder-r-range=25:200
--finding-run-smoother=none
--constraint-step-size-mm=1
--search-window=3:3
--input-events=10
